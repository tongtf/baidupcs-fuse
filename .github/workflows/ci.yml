name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

# 避免同一分支多次推送/PR 时任务重复排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.23'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.23']
        include:
          - os: ubuntu-latest
            go: 'stable'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt："; echo "$unformatted"; exit 1
          fi

      - name: Build
        # 模块根即仓库根(go.mod 位于仓库根，扁平化发布树)
        run: |
          go build ./...
          go vet ./...

      - name: Unit tests (race)
        # 全包覆盖（含 adapter mock）；仅需内存/逻辑覆盖,不依赖真实账号;集成/e2e 需人工运行
        run: go test ./... -count=1 -race

      - name: Coverage gate (every package >= 80%)
        # 每个 Go 包语句覆盖率必须 >=80%；不设总量豁免，避免低覆盖包被平均值掩盖。
        # 失败时输出 ::error 注解，便于在 Checks/API 中直接定位包与测试。
        run: |
          set -uo pipefail
          test_status=0
          go test ./... -count=1 -coverprofile=coverage.out | tee coverage.log || test_status=$?

          bad=0
          awk '
            /^ok/ {
              pkg=$2; pct="";
              for (i=1; i<=NF; i++) if ($i=="coverage:") pct=$(i+1);
              gsub(/%/, "", pct);
              if (pct == "" || pct+0 < 80) {
                printf "::error title=Coverage gate::%s coverage=%s%% (<80%%)\n", pkg, pct;
                bad=1;
              }
            }
            END { exit bad }
          ' coverage.log || bad=1

          if [ "$test_status" -ne 0 ]; then
            echo "::error title=go test failed::coverage run exit=$test_status"
            grep -A 6 -E '^(FAIL|--- FAIL|panic:)|_test\.go:[0-9]+:' coverage.log | while IFS= read -r line; do
              echo "::error title=Test failure::$line"
            done
            bad=1
          fi
          exit "$bad"

      - name: Build binaries (linux / darwin, amd64 / arm64)
        # 验证交叉编译在主流平台均可产出可执行文件
        run: |
          set -e
          for osarch in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${osarch%/*}; arch=${osarch#*/}
            GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/bdfs/ || exit 1
            echo "OK: $osarch"
          done
